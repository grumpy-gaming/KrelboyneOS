# KOS Doctor checks
#
# Each [section] is one check. The section name is its short id.
#   name    = shown name
#   group   = checkup  (worth checking any time; the default)
#             catch-up (things older KrelboyneOS versions got wrong)
#   test    = shell command run as the user; exit 0 means OK
#   detail  = shell command whose output is shown with the result (optional)
#   fix     = shell command that fixes it (leave out if there is no fix)
#   root    = yes if the fix needs the administrator password
#   explain = one or two sentences on what is wrong and why it matters
#   after   = shown after a successful fix (optional)
#
# Checks run in this order, so put one that another depends on first.
# People can ignore a check; the ids they ignore are kept in
# ~/.config/kos-doctor/ignored.

# ---- Checkup ----

[updates]
name = System up to date
test = find /var/lib/apt/lists -maxdepth 1 -name '*_InRelease' -mtime -7 | grep -q . && [ -z "$(apt list --upgradable 2>/dev/null | grep -v '^Listing')" ]
detail = n=$(apt list --upgradable 2>/dev/null | grep -vc '^Listing'); d=$(find /var/lib/apt/lists -maxdepth 1 -name '*_InRelease' -printf '%TY-%Tm-%Td\n' | sort | tail -n 1); echo "$n update(s) waiting; update list last refreshed ${d:-never}"
fix = export DEBIAN_FRONTEND=noninteractive; apt-get update && apt-get -y -o Dpkg::Options::=--force-confold upgrade
root = yes
explain = Updates bring security fixes. Either updates are waiting, or the update list has not been refreshed for a week.
after = Check again afterwards: a kernel update needs a restart.

[restart]
name = No restart needed
test = [ "$(uname -r)" = "$(ls /lib/modules | sort -V | tail -n 1)" ]
detail = echo "Running kernel $(uname -r); newest installed $(ls /lib/modules | sort -V | tail -n 1)"
explain = A newer Linux kernel is installed but the computer is still running the old one. Restart when it suits you to finish the update.

[failed-services]
name = No failed services
test = [ -z "$(systemctl --failed --no-legend --plain 2>/dev/null)" ] && [ -z "$(systemctl --user --failed --no-legend --plain 2>/dev/null)" ]
detail = { systemctl --failed --no-legend --plain; systemctl --user --failed --no-legend --plain; } 2>/dev/null | awk '{print $1}'
explain = A background service failed to start. See why with "systemctl status NAME" in a terminal, or ask in the KrelboyneOS Discord.

[sound-services]
name = Sound services running
test = systemctl --user is-active --quiet pipewire pipewire-pulse wireplumber
fix = systemctl --user restart pipewire pipewire-pulse wireplumber
explain = PipeWire is installed but not running for your user, so apps have nowhere to send sound.

[time-sync]
name = Clock set from the internet
test = [ "$(timedatectl show -p NTP --value 2>/dev/null)" = yes ]
fix = apt-get install -y systemd-timesyncd && timedatectl set-ntp true
root = yes
explain = Nothing keeps the clock right, so it slowly drifts. A wrong clock can break secure websites and updates.

[packages-ok]
name = No broken packages
test = [ -z "$(dpkg --audit 2>/dev/null)" ]
fix = dpkg --configure -a && apt-get -f install -y
root = yes
explain = Some packages are only half installed or configured, usually after an install was interrupted. That can block updates.

[disk-space]
name = Enough free disk space
test = [ "$(df --output=pcent / | tail -n 1 | tr -dc 0-9)" -lt 90 ]
detail = df -h --output=pcent,avail / | tail -n 1 | awk '{print $1 " used, " $2 " free"}'
explain = The system disk is over 90% full. Free space with the package cache and log fixes below, by emptying ~/.cache, and by removing old downloads such as ISO files.

[apt-cache]
name = Package cache under 1 GB
test = [ "$(du -sm /var/cache/apt/archives 2>/dev/null | cut -f1)" -lt 1024 ]
detail = echo "$(du -sh /var/cache/apt/archives 2>/dev/null | cut -f1) of downloaded packages"
fix = apt-get clean
root = yes
explain = Every package apt downloads stays in /var/cache/apt/archives. They are not needed once installed.

[journal]
name = System logs under 1 GB
test = [ "$(du -sm /var/log/journal 2>/dev/null | cut -f1)" -lt 1024 ]
detail = echo "$(du -sh /var/log/journal 2>/dev/null | cut -f1) of logs"
fix = journalctl --vacuum-size=500M
root = yes
explain = The system log has grown large. Trimming it to 500 MB keeps recent history.

[font-cache]
name = Font cache readable
test = ! find "${XDG_CACHE_HOME:-$HOME/.cache}/fontconfig" -maxdepth 1 -name '*.cache-9' -type l 2>/dev/null | grep -q .
fix = rm -rf "${XDG_CACHE_HOME:-$HOME/.cache}/fontconfig" && fc-cache -f
explain = A program with its own newer copy of fontconfig, such as a downloaded Chromium, rewrote your font cache in a format the system can't read, so text can turn into boxes or icons. Rebuilding the cache fixes it.
after = Close and reopen any window that still shows boxes, or log out and back in.

# ---- Catch-up for older KrelboyneOS versions ----

[sound-packages]
name = Sound packages
group = catch-up
test = for p in pipewire-audio wireplumber alsa-utils pavucontrol xfce4-pulseaudio-plugin; do dpkg-query -W -f='${db:Status-Abbrev}' "$p" 2>/dev/null | grep -q '^ii' || exit 1; done
fix = apt-get install -y pipewire-audio alsa-utils pavucontrol xfce4-pulseaudio-plugin
root = yes
explain = The PipeWire sound system or the volume control is not installed, so there is no sound. KrelboyneOS 0.1.1 and older shipped without them.
after = Log out and back in to start the sound services.

[volume-icon]
name = Volume icon in the panel
group = catch-up
test = xfconf-query -c xfce4-panel -lv 2>/dev/null | grep -q pulseaudio
fix = xfce4-panel --add=pulseaudio
explain = The volume control is installed but not on the panel. KrelboyneOS 0.1.1 and older left it out. If you removed it on purpose, press Ignore.
after = If Xfce asks which panel, pick the top one.

[path-terminal]
name = ~/.local/bin on the terminal PATH
group = catch-up
test = grep -qsE '^[^#]*PATH=.*\.local/bin' "$HOME/.zshrc"
fix = echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$HOME/.zshrc"
explain = Tools you install for yourself (npm, pipx and others) go to ~/.local/bin, but zsh does not look there, so their commands are not found.
after = Open a new terminal to use it.

[path-desktop]
name = ~/.local/bin on the desktop PATH
group = catch-up
test = grep -qsE '^[^#]*PATH=.*\.local/bin' "$HOME/.xsessionrc"
fix = echo 'PATH="$HOME/.local/bin:$PATH"' >> "$HOME/.xsessionrc"
explain = Apps started from the menu do not look in ~/.local/bin, so they cannot find tools installed there (for example Kule cannot find the Gemini CLI).
after = Log out and back in for the desktop to pick it up.

[npm-prefix]
name = npm installs into your home folder
group = catch-up
test = command -v npm >/dev/null || exit 0; case "$(npm config get prefix 2>/dev/null)" in "$HOME"/*) exit 0;; esac; exit 1
fix = npm config set prefix "$HOME/.local"
explain = npm install -g tries to write to /usr/local and fails with "permission denied". Using sudo for it is unsafe.
after = Global npm tools now go to ~/.local/bin, so make sure that is on your PATH too.

[login-settings]
name = Login screen settings kept on updates
group = catch-up
test = grep -qs '^# KrelboyneOS' /etc/lightdm/lightdm-gtk-greeter.conf
fix = sed -i '/^\[greeter\]/a # KrelboyneOS\nbackground=/usr/share/krelboyneos/branding/login.jpg\ntheme-name=Arc-Dark' /etc/lightdm/lightdm-gtk-greeter.conf
root = yes
explain = The login screen's background and theme are only in a file that package updates replace, so an update can reset the login screen to Debian's look.

[ssl-cert]
name = This computer's SSL certificate
group = catch-up
test = [ -e /etc/ssl/certs/ssl-cert-snakeoil.pem ] || ! dpkg-query -W -f='${db:Status-Abbrev}' ssl-cert 2>/dev/null | grep -q '^ii'
fix = make-ssl-cert generate-default-snakeoil --force-overwrite && systemctl try-restart postgresql
root = yes
explain = The installer leaves out this computer's default SSL certificate, so PostgreSQL cannot start. KrelboyneOS 0.1.4 and older are affected.
