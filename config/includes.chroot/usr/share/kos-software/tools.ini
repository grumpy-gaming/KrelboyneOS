# KOS Software tool list
#
# Each [section] is one tool. The section name is its short id.
#   group       = the sidebar page it shows on (Development, Security)
#   method      = apt     a Debian package (installed with apt)
#                 script  a recipe in kos-install-tools (install_<id>)
#   package     = the Debian package (apt: defaults to the id)
#   name        = shown name (defaults to the package name)
#   description = one line (apt: defaults to Debian's description)
#   check       = a file that exists once the tool is installed
#   message     = shown after a successful install
#
# A Debian package only needs two lines, for example:
#   [nikto]
#   group = Security
#   method = apt

[bruno]
name = Bruno
group = Development
method = script
package = bruno
description = Open-source API client for testing and exploring APIs

[metasploit]
name = Metasploit Framework
group = Security
method = script
package = metasploit-framework
description = Penetration testing framework with exploits and payloads

[bloodhound]
name = BloodHound CE
group = Security
method = script
check = ~/bloodhound/bloodhound-cli
description = Maps Active Directory attack paths (needs 8 GB RAM, runs in Docker)
message = Save the admin password shown in the details below, then open http://localhost:8080/ui/login in Firefox.

[burp]
name = Burp Suite Community
group = Security
method = script
check = ~/BurpSuiteCommunity/BurpSuiteCommunity
description = Web application security testing proxy
