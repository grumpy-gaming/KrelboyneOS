# KOS Doctor checks
#
# Each [section] is one check. The section name is its short id.
#   name    = shown name
#   test    = shell command run as the user; exit 0 means OK
#   fix     = shell command that fixes it (leave out if there is no fix)
#   root    = yes if the fix needs the administrator password
#   explain = one or two sentences on what is wrong and why it matters
#   after   = shown after a successful fix (optional)
#
# Checks run in this order, so put one that another depends on first.

[sound-packages]
name = Sound packages
test = for p in pipewire-audio wireplumber alsa-utils pavucontrol xfce4-pulseaudio-plugin; do dpkg-query -W -f='${db:Status-Abbrev}' "$p" 2>/dev/null | grep -q '^ii' || exit 1; done
fix = apt-get install -y pipewire-audio alsa-utils pavucontrol xfce4-pulseaudio-plugin
root = yes
explain = The PipeWire sound system or the volume control is not installed, so there is no sound. KrelboyneOS 0.1.1 and older shipped without them.
after = Log out and back in to start the sound services.

[sound-services]
name = Sound services running
test = systemctl --user is-active --quiet pipewire pipewire-pulse wireplumber
fix = systemctl --user restart pipewire pipewire-pulse wireplumber
explain = PipeWire is installed but not running for your user, so apps have nowhere to send sound.

[volume-icon]
name = Volume icon in the panel
test = xfconf-query -c xfce4-panel -lv 2>/dev/null | grep -q pulseaudio
fix = xfce4-panel --add=pulseaudio
explain = The volume control is installed but not on the panel. KrelboyneOS 0.1.1 and older left it out.
after = If Xfce asks which panel, pick the top one.

[path-terminal]
name = ~/.local/bin on the terminal PATH
test = grep -qsE '^[^#]*PATH=.*\.local/bin' "$HOME/.zshrc"
fix = echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$HOME/.zshrc"
explain = Tools you install for yourself (npm, pipx and others) go to ~/.local/bin, but zsh does not look there, so their commands are not found.
after = Open a new terminal to use it.

[path-desktop]
name = ~/.local/bin on the desktop PATH
test = grep -qsE '^[^#]*PATH=.*\.local/bin' "$HOME/.xsessionrc"
fix = echo 'PATH="$HOME/.local/bin:$PATH"' >> "$HOME/.xsessionrc"
explain = Apps started from the menu do not look in ~/.local/bin, so they cannot find tools installed there (for example Kule cannot find the Gemini CLI).
after = Log out and back in for the desktop to pick it up.

[npm-prefix]
name = npm installs into your home folder
test = command -v npm >/dev/null || exit 0; case "$(npm config get prefix 2>/dev/null)" in "$HOME"/*) exit 0;; esac; exit 1
fix = npm config set prefix "$HOME/.local"
explain = npm install -g tries to write to /usr/local and fails with "permission denied". Using sudo for it is unsafe.
after = Global npm tools now go to ~/.local/bin, so make sure that is on your PATH too.

[time-sync]
name = Clock set from the internet
test = [ "$(timedatectl show -p NTP --value 2>/dev/null)" = yes ]
fix = apt-get install -y systemd-timesyncd && timedatectl set-ntp true
root = yes
explain = Nothing keeps the clock right, so it slowly drifts. A wrong clock can break secure websites and updates.

[login-settings]
name = Login screen settings kept on updates
test = grep -qs '^# KrelboyneOS' /etc/lightdm/lightdm-gtk-greeter.conf
fix = sed -i '/^\[greeter\]/a # KrelboyneOS\nbackground=/usr/share/krelboyneos/branding/login.jpg\ntheme-name=Arc-Dark' /etc/lightdm/lightdm-gtk-greeter.conf
root = yes
explain = The login screen's background and theme are only in a file that package updates replace, so an update can reset the login screen to Debian's look.

[packages-ok]
name = No broken packages
test = [ -z "$(dpkg --audit 2>/dev/null)" ]
fix = dpkg --configure -a && apt-get -f install -y
root = yes
explain = Some packages are only half installed or configured, usually after an install was interrupted. That can block updates.

[disk-space]
name = Enough free disk space
test = [ "$(df --output=pcent / | tail -n 1 | tr -dc 0-9)" -lt 90 ]
explain = The system disk is over 90% full. Free space with "sudo apt clean", by emptying ~/.cache, and by removing old downloads such as ISO files.
