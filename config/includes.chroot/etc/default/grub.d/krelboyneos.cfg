# KrelboyneOS GRUB settings for the installed system (read after /etc/default/grub)
GRUB_DISTRIBUTOR="KrelboyneOS"
GRUB_THEME="/boot/grub/themes/krelboyneos/theme.txt"
GRUB_BACKGROUND="/boot/grub/themes/krelboyneos/background.jpg"
# Show the boot splash; keep whatever else the installer added (resume=, etc.)
case " $GRUB_CMDLINE_LINUX_DEFAULT " in
  *" splash "*) ;;
  *) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT splash" ;;
esac
