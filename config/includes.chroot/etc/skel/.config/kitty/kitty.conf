# KrelboyneOS defaults for kitty. Everything else uses kitty's own defaults;
# see https://sw.kovidgoyal.net/kitty/conf/ for the full list of options.

# Ctrl+C copies when text is selected (otherwise interrupts), Ctrl+V pastes,
# and selecting text copies it to the clipboard
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
copy_on_select clipboard
